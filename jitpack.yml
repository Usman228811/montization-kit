jdk:
  - openjdk21

before_install:
  - echo "=== JAVA ==="
  - java -version
  - echo "=== CURRENT DIRECTORY ==="
  - pwd
  - echo "=== WRAPPER DIRECTORY ==="
  - ls -lah gradle/wrapper/
  - echo "=== WRAPPER JAR CONTENT ==="
  - jar tf gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain || true
  - echo "=== GRADLEW ==="
  - ls -lah gradlew
  - chmod +x gradlew

install:
  - ./gradlew :MonetizeKit:publishToMavenLocal --no-daemon --console=plain