jdk:
  - openjdk21
before_install:
  - ls -la gradle/wrapper
  - curl -sSL -o "$HOME/gradle-9.6.1-bin.zip" https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
  - unzip -q -o "$HOME/gradle-9.6.1-bin.zip" -d "$HOME" || (cd "$HOME" && jar xf gradle-9.6.1-bin.zip)
install:
  - sh "$HOME/gradle-9.6.1/bin/gradle" :MonetizeKit:publishToMavenLocal --console=plain
